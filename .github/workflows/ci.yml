name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install bun
        run: npm install --global bun
      - name: Install dependencies
        run: bun install
      - name: Run Biome
        run: bun run biome ci .

  type-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install bun
        run: npm install --global bun
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
